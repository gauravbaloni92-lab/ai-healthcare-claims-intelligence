{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-dark text-white">

                <h3>

    <i class="fas fa-user-shield"></i>

    Admin Login

</h3>

            </div>

            <div class="card-body">
                {% if error %}

<div class="alert alert-danger">

    <i class="fas fa-circle-exclamation"></i>

    {{ error }}

</div>

{% endif %}
                <form method="POST">

                    <div class="mb-3">

                        <label>Username</label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>

                    </div>

                    <button class="btn btn-primary">

                        Login

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
